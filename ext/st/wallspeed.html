<div
  data-yai-tabs
  data-swipe
  data-behavior="zoom"
  data-theme="light"
  data-color-accent="dark"
  data-auto-accessibility="false"
  data-st-bg-color="#1e1e1e"
>
  <nav data-controller>
    <button
      data-tab-action="open"
      data-open="1"
      data-default
      data-delay="150"
      data-min-loading="400"
      data-url="https://eypsilon.github.io/blank-app/ext/st/wallpaper/bg-color.html"
    >Colors</button>
    <button
      data-tab-action="open"
      data-open="2"
      data-delay="150"
      data-min-loading="400"
      data-url="https://eypsilon.github.io/blank-app/ext/st/wallpaper/list.html"
    >Gallery</button>
  </nav>
  <div data-content data-st-bg-color="#1e1e1e">
    <div data-tab="1" data-spaceless class="h-auto"></div>
    <div data-tab="2" data-spaceless class="h-auto"></div>
  </div>
</div>
